name: Limpieza puntual de autoría pública

on:
  push:
    paths:
      - '.github/workflows/limpiar-historial.yml'

permissions:
  contents: write

jobs:
  sanear_autoria:
    if: github.repository == 'PYMEDigitalMochis/prompts-es-publicos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validar, reescribir la autoría y retirar este flujo temporal
        shell: bash
        env:
          NOREPLY_EMAIL: 337031121+PYMEDigitalMochis@users.noreply.github.com
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/workflows/limpiar-historial.yml
          python3 -m unittest discover -s tests -p validar_biblioteca.py -v
          git config user.name "PYMEDigitalMochis"
          git config user.email "$NOREPLY_EMAIL"
          export FILTER_BRANCH_SQUELCH_WARNING=1
          export CLEAN_COMMIT_EMAIL="$NOREPLY_EMAIL"
          git filter-branch --force --env-filter '
            export GIT_AUTHOR_EMAIL="$CLEAN_COMMIT_EMAIL"
            export GIT_COMMITTER_EMAIL="$CLEAN_COMMIT_EMAIL"
          ' -- main
          git rm .github/workflows/limpiar-historial.yml
          git commit -m "Retirar flujo temporal tras sanear la autoría pública"
          test "$(git log --format='%ae%n%ce' main | grep -cv '@users.noreply.github.com' || true)" = "0"
          test ! -e .github/workflows/limpiar-historial.yml
          python3 -m unittest discover -s tests -p validar_biblioteca.py -v
          git push --force-with-lease="refs/heads/main:${GITHUB_SHA}" origin main:main
